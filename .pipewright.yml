# .pipewright.yml
# 流水线即代码配置文件
# 功能：拉取代码后，根据远程服务器可达性，将 README.md 复制到不同目标

version: 1

stages:
  # ============================================================
  # 阶段 1: 拉取远程仓库代码
  # ============================================================
  - id: stg_src
    name: 流水线源
    kind: source
    jobs:
      - name: 拉取代码
        type: git_source
        # 使用项目绑定的仓库凭据，无需额外配置

  # ============================================================
  # 阶段 2: 条件复制 README.md 文件
  # ============================================================
  - id: stg_copy
    name: 复制 README.md
    kind: build
    needs: [stg_src]
    jobs:
      - name: 条件复制文件
        type: script
        script:
          image: alpine:latest
          commands:
            # 安装必要工具
            - apk add --no-cache openssh-client sshpass rsync

            # 定义变量
            - SOURCE_FILE="README.md"
            - REMOTE_HOST="192.168.1.1"
            - REMOTE_USER="root"
            - REMOTE_PATH="/opt/docker/"
            - LOCAL_FALLBACK_PATH="/home/tom/"
            - LOCAL_HOST="192.168.2.2"
            - TIMESTAMP=$(date +%Y%m%d_%H%M%S)

            # ------------------------------------------------------------
            # 检查远程服务器 192.168.1.1 是否可达 (端口 22)
            # ------------------------------------------------------------
            - echo "🔍 检查远程服务器 ${REMOTE_HOST} 是否可达..."
            - |
              if nc -zv ${REMOTE_HOST} 22 2>/dev/null; then
                echo "✅ 远程服务器 ${REMOTE_HOST} 可达，执行远程复制"

                # 检查远程目录是否存在同名文件
                REMOTE_FILE_EXISTS=$(ssh -o StrictHostKeyChecking=no ${REMOTE_USER}@${REMOTE_HOST} "test -f ${REMOTE_PATH}README.md && echo 'exists' || echo 'not_exists'")

                if [ "$REMOTE_FILE_EXISTS" = "exists" ]; then
                  # 同名文件存在 → 重命名旧文件加时间戳后缀
                  echo "⚠️ 远程目录已存在 README.md，重命名为 README_${TIMESTAMP}.md"
                  ssh -o StrictHostKeyChecking=no ${REMOTE_USER}@${REMOTE_HOST} \
                    "mv ${REMOTE_PATH}README.md ${REMOTE_PATH}README_${TIMESTAMP}.md"
                fi

                # 复制 README.md 到远程服务器
                echo "📤 复制 ${SOURCE_FILE} 到 ${REMOTE_HOST}:${REMOTE_PATH}"
                scp -o StrictHostKeyChecking=no ${SOURCE_FILE} ${REMOTE_USER}@${REMOTE_HOST}:${REMOTE_PATH}

                echo "✅ 文件已成功复制到远程服务器 ${REMOTE_HOST}:${REMOTE_PATH}"

              else
                # ------------------------------------------------------------
                # 远程服务器不可达 → 复制到本地备用服务器 192.168.2.2
                # ------------------------------------------------------------
                echo "❌ 远程服务器 ${REMOTE_HOST} 不可达，切换到本地服务器 ${LOCAL_HOST}"

                # 检查本地目录是否存在同名文件
                LOCAL_FILE_EXISTS=$(ssh -o StrictHostKeyChecking=no tom@${LOCAL_HOST} "test -f ${LOCAL_FALLBACK_PATH}README.md && echo 'exists' || echo 'not_exists'")

                if [ "$LOCAL_FILE_EXISTS" = "exists" ]; then
                  # 同名文件存在 → 重命名旧文件加时间戳后缀
                  echo "⚠️ 本地目录已存在 README.md，重命名为 README_${TIMESTAMP}.md"
                  ssh -o StrictHostKeyChecking=no tom@${LOCAL_HOST} \
                    "mv ${LOCAL_FALLBACK_PATH}README.md ${LOCAL_FALLBACK_PATH}README_${TIMESTAMP}.md"
                fi

                # 复制 README.md 到本地备用服务器
                echo "📤 复制 ${SOURCE_FILE} 到 ${LOCAL_HOST}:${LOCAL_FALLBACK_PATH}"
                scp -o StrictHostKeyChecking=no ${SOURCE_FILE} tom@${LOCAL_HOST}:${LOCAL_FALLBACK_PATH}

                echo "✅ 文件已成功复制到本地服务器 ${LOCAL_HOST}:${LOCAL_FALLBACK_PATH}"
              fi

          env:
            # 这些变量可从 UI 画布配置中注入
            REMOTE_USER: "root"
            REMOTE_PASSWORD: "${REMOTE_PASSWORD}"  # 从 UI 凭据中获取
            LOCAL_USER: "tom"