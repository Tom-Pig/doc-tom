services:
  nginx-http:
    image: nginx:1.28.2
    container_name: nginx-http
    restart: unless-stopped
    ports:
      - "3001:80"
    volumes:
      - ./nginx-http/html:/usr/share/nginx/html:ro
      - ./nginx-http/conf.d:/etc/nginx/conf.d:ro
      - ./nginx-http/logs:/var/log/nginx
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "2"