# ============================================
# 1. 上游服务器池（后端应用集群）
# ============================================
upstream backend {


# 负载均衡策略（仅启用一种）：
# - 轮询（默认）：按序轮流分发，适合同构服务器、无状态应用
# - 加权轮询：按 weight 比例分发，适合异构服务器、灰度发布
# - 最少连接（当前）：分发给连接数最少的服务器，适合长连接（WebSocket/gRPC）或请求耗时差异大的场景
# - IP 哈希：同一客户端 IP 始终访问同一台服务器，适合本地 Session 缓存
# - 通用哈希：按自定义变量（URL/Cookie/参数）哈希分发，适合缓存集群、自定义路由


    least_conn;

    server 192.168.1.10:8080 weight=3 max_fails=3 fail_timeout=30s;		#被动健康检查，当请求到达该后端失败3次后,标记该服务故障,并在30s内不会分配请求
    server 192.168.1.11:8080 weight=2 max_fails=3 fail_timeout=30s;
    server 192.168.1.12:8080 weight=1 backup;  # 备用节点

   
    keepalive 64; # 保持长连接，减少握手开销（建议调大）
}

# ============================================
# 2. HTTP 强制跳转 HTTPS
# ============================================
server {
    listen 80;
    server_name your-domain.com;  # 替换为你的域名

    # 将所有HTTP请求301重定向到HTTPS
    return 301 https://$server_name$request_uri;
}

# ============================================
# 3. HTTPS 主服务（核心配置）
# ============================================
server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 替换为你的域名

    # ---------- SSL/TLS 证书 ----------
    ssl_certificate /etc/nginx/ssl/your-domain.crt;
    ssl_certificate_key /etc/nginx/ssl/your-domain.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;      #是否优先使用当前配置中的加密套件，一般为off优先使用客户端的加密套件

# HSTS：强制浏览器在缓存期内仅通过 HTTPS 访问，防止中间人攻击与 SSL 剥离
# max-age=31536000：缓存 1 年（测试期建议 3600，稳定后改为 31536000）
# includeSubDomains：覆盖所有子域名（需确认子域名均支持 HTTPS）
# preload：申请加入浏览器预加载列表（不可撤销，确保永久无需回退 HTTP）

    add_header Strict-Transport-Security "max-age=600; includeSubDomains; preload" always;

    #  安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;                             # 防点击劫持：仅允许同源页面嵌入当前页面
    add_header X-Content-Type-Options "nosniff" always;                         # 防 MIME 嗅探：强制浏览器遵循 Content-Type，禁止自动推断文件类型
    add_header X-XSS-Protection "1; mode=block" always;                         # 防反射型 XSS：启用浏览器 XSS 过滤器，检测到攻击时阻止页面渲染
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;        # 防隐私泄露：同源请求发送完整 URL，跨域请求仅发送来源（不含路径与参数）

    # SSL会话缓存
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ---------- 日志 ----------
    access_log /var/log/nginx/frontend_access.log main;
    error_log /var/log/nginx/frontend_error.log warn;

    # ---------- 前端静态资源 ----------
    root /usr/share/nginx/html;
    index index.html;

    # 静态资源缓存（独立 location，优先级更高）
    location ~* \.(jpg|jpeg|png|gif|ico|svg|css|js|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        # 如果文件不存在，不重定向到 index.html，直接返回 404
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        
        # 禁用缓存 index.html（防止更新后用户看到旧版本）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---------- 后端 API 代理 ----------
    location /api/ {
        proxy_pass http://backend;  # 注意末尾有斜杠

        # 转发关键 Header
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # 长连接支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 禁止后端返回 404 时被 SPA 拦截
        proxy_intercept_errors off;

        # 被动故障转移，当请求失败后会尝试其他节点
        proxy_next_upstream error
                            timeout
                            http_502
                            http_503
                            http_504;
    }

    # ---------- 健康检查端点 ----------
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ---------- 错误页面 ----------
    # 前端 404 由 SPA 路由自己处理，Nginx 只兜底
    error_page 404 /index.html;
    
    # 服务器错误（500/502/503/504）显示维护页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
