name: doc-tom-db

# =====================================================================
# 共享配置（YAML 锚点，供各服务复用）
# =====================================================================

# 日志轮转：单文件 10m、保留 3 份
x-logging-default: &logging-default
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# 通用环境变量
x-env-common: &env-common
  TZ: Asia/Shanghai
  LANG: C.UTF-8

# 资源硬上限（compose v2 非 swarm 模式同样生效）
x-resources: &resources
  resources:
    limits:
      cpus: "2.0"
      memory: 1G
      pids: 1024

# =====================================================================
# 服务定义
# =====================================================================

# -------------------------------------------------------------------
# MySQL 8.4（LTS）
# -------------------------------------------------------------------
services:
  mysql:
    # 镜像与生命周期
    image: mysql:8.4
    restart: unless-stopped            # 除手动停止外自动重启

    # 文件系统加固
    read_only: true                    # 只读根文件系统
    tmpfs:
      - /var/run/mysqld                # socket 目录
      - /tmp

    # 环境变量与敏感信息
    environment:
      <<: *env-common
      MYSQL_ROOT_PASSWORD: "1538"
      MYSQL_PASSWORD: "1538"
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}       # root 允许任意主机（仅内网）
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test-db}   # 首次启动自动建库
      MYSQL_USER: ${MYSQL_USER:-tom}               # 业务账号
      MYSQL_INITDB_SKIP_TZINFO: "0"                # 初始化写入时区表

    # 端口与网络
    ports:
      - "${MYSQL_PORT:-3306}:3306"     # 宿主机端口由 .env 控制
    networks:
      - test_net

    # 数据持久化
    volumes:
      - mysql_data:/var/lib/mysql                     # 数据卷
      - ./mysql/conf.d:/etc/mysql/conf.d:ro           # 数据库参数配置
      - ./mysql/init:/docker-entrypoint-initdb.d:ro   # 初始化 SQL 脚本
      - ./mysql/logs:/var/log/mysql                   # 错误日志

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s                # 启动宽限期，期间失败不计入重试

    # 资源与系统限制
    deploy:
      <<: *resources
    ulimits:
      nofile: { soft: 65535, hard: 65535 }   # 文件描述符上限
    stop_grace_period: 30s

    # 可观测性与安全
    labels:
      - "project=doc-tom"
      - "service=mysql"
      - "env=dev"
    logging: *logging-default
    security_opt:
      - no-new-privileges:true

# -------------------------------------------------------------------
# PostgreSQL 16
# -------------------------------------------------------------------
  postgres:
    # 镜像与生命周期
    image: postgres:16-alpine
    restart: on-failure:5              # 仅异常退出时重启，最多 5 次

    # 文件系统加固
    read_only: true
    tmpfs:
      - /var/run/postgresql            # socket 目录
      - /tmp

    # 环境变量与敏感信息
    environment:
      <<: *env-common
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: "app_password"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      PGTZ: Asia/Shanghai

    # 端口与网络
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - test_net

    # 数据持久化
    volumes:
      - pg_data:/var/lib/postgresql/data          # 数据卷
      - ./pg/init:/docker-entrypoint-initdb.d:ro  # 初始化 SQL 脚本

    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    # 资源与系统限制
    deploy:
      <<: *resources
    ulimits:
      nofile: { soft: 65535, hard: 65535 }
    shm_size: "512mb"                  # 共享内存，影响排序/哈希性能
    stop_grace_period: 60s             # 优雅停机需等待 checkpoint

    # 可观测性与安全
    labels:
      - "project=doc-tom"
      - "service=postgres"
      - "env=dev"
    logging: *logging-default
    security_opt:
      - no-new-privileges:true

# =====================================================================
# 网络 / 卷
# =====================================================================

# 自定义网络：固定子网，便于防火墙规则与网络规划
networks:
  test_net:
    name: doc-tom-db-net
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
    labels:
      - "project=doc-tom"
      - "env=dev"
      - "managed-by=docker-compose"

# 具名数据卷：数据与容器生命周期解耦
volumes:
  mysql_data:
    name: doc-tom-mysql-data
    driver: local
    labels:
      - "project=doc-tom"
      - "env=dev"
  pg_data:
    name: doc-tom-pg-data
    driver: local
    labels:
      - "project=doc-tom"
      - "env=dev"
